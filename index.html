<style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;background:#101b2b;color:#edf5ff}
*{box-sizing:border-box}
body{margin:0}
button,select,input{font:inherit}
button{cursor:pointer;background:#304d68;border:1px solid #6e8ca4;color:#fff;border-radius:9px;padding:11px}
button:hover{background:#436783}
button:disabled{opacity:.35}
.primary{background:#e2bd77;color:#172438;font-weight:800;border:0}
.wrap{max-width:1040px;margin:auto;padding:15px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #34465a;padding:13px 0}
h1{font-size:clamp(20px,4vw,29px);margin:0}
h2{font-size:21px;margin:15px 0 9px}
.muted,small{color:#b1c4d5}
.panel{background:#1b2d42;border:1px solid #3a5066;border-radius:13px;padding:14px;margin:12px 0}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}
.town{min-height:133px;text-align:left;background:#243b52}
.town.sel{outline:3px solid #e9c779}
.town strong{font-size:18px}
.town small{display:block;margin:6px 0}
.tag{color:#f4d48b}
.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status>div{flex:1;min-width:140px;background:#263d55;padding:10px;border-radius:9px}
.bar{height:8px;border-radius:8px;background:#475468;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:#88d7b6}
.stage{position:relative;background:#14263c;border-radius:12px;overflow:hidden}
canvas{width:100%;height:auto;display:block}
.event{font-weight:800;color:#ffe0a1;font-size:clamp(16px,3.4vw,24px);text-align:center;min-height:32px;padding:8px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}
.fine{font-size:12px;line-height:1.65;color:#a9bdcf}
#picklist{max-height:390px;overflow:auto}
select,input{background:#21364d;color:white;border:1px solid #70869b;border-radius:8px;padding:10px;max-width:100%}
.winner{font-size:34px;color:#f4d28e;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:10px;background:#263b52;border-radius:8px}
.hidden{display:none!important}
.hero{padding:35px 8px;text-align:center}
.hero p{line-height:1.8}
.chip{padding:5px 9px;border:1px solid #688096;border-radius:20px;font-size:13px}
.hudunit small{display:block;margin-top:5px;color:#edf5ff}
.hudunit .role{color:#f0d28c}
.hudunit .sh{color:#9cdeff}
.konote{display:block;margin-top:6px;opacity:.68}
.log{font-size:13px;line-height:1.7;color:#c9d8e6;margin:0;padding-left:18px}
@media(max-width:600px){
  .wrap{padding:9px}.panel{padding:10px}.town{min-height:120px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .town strong{font-size:15px}.town small{font-size:11px}
  .controls button{padding:9px}
}
</style>

const TPS = 60;                 // 1ゲーム秒あたりのtick数
const TICK_LIMIT = 50 * TPS;    // 50ゲーム秒
const SHIELD_BASE = 23;
const SHIELD_TICKS = 8 * TPS;   // シールド有効期限 8ゲーム秒

// 1000×560 座標系の論理配置
const POS = {
  blue: { front: { x: 335, y: 430, scale: 1.15 }, rear: { x: 155, y: 257, scale: .79 } },
  red:  { front: { x: 665, y: 430, scale: 1.15 }, rear: { x: 845, y: 257, scale: .79 } }
};

// 技は表示名ではなく id と attackStyle で識別する（F07）
const SKILLS = {
  elder:    { id: 'elder_magic',       displayName: '長老の大魔法',     attackStyle: 'magic',   effectKind: 'damage', statBasis: 'elder_pct', stat: 'mag', mul: 1.9 },
  dense:    { id: 'density_rush',      displayName: '人口密集ラッシュ', attackStyle: 'melee',   effectKind: 'damage', statBasis: 'density',   stat: 'atk', mul: 1.65 },
  wide:     { id: 'wide_guard',        displayName: '広域防衛線',       attackStyle: 'support', effectKind: 'shield', statBasis: 'area' },
  care:     { id: 'generation_wisdom', displayName: '世代の知恵',       attackStyle: 'support', effectKind: 'heal',   statBasis: 'age75_pct' },
  balanced: { id: 'town_power',        displayName: 'まちの底力',       attackStyle: 'melee',   effectKind: 'damage', statBasis: 'temporary', stat: 'atk', mul: 1.65 }
};
const SKILLS_BY_ID = Object.fromEntries(Object.values(SKILLS).map(s => [s.id, s]));

// HTMLエスケープ（F08）
const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(s) { return String(s).replace(/[&<>"']/g, c => HTML_ESCAPES[c]); }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const posOf = (side, role) => ({ ...POS[side][role] });

// 戦闘用のシード付き乱数（ドラフト抽選の Math.random とは別物）
function rng(s) {
  s.r = (s.r + 0x6D2B79F5) >>> 0;
  let t = s.r;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function shuffleWith(a, rand = Math.random) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function unit(d) {
  const e = d.elder_pct, den = d.density_per_km2_mixed_year, area = d.area_km2_2025, p = d.population_2026_04_01;
  const type = e >= 38 ? 'elder' : den >= 2500 ? 'dense' : area >= 180 ? 'wide' : d.age75_pct >= 19 ? 'care' : 'balanced';
  const st = {
    hp:  Math.round(clamp(98 + (area > 180 ? 13 : 0) + (e > 37 ? 7 : 0), 82, 126)),
    atk: Math.round(clamp(92 + Math.log10(p / 20000) * 8, 75, 115)),
    def: Math.round(clamp(92 + Math.log10(Math.max(10, area) / 50) * 13, 75, 121)),
    spd: Math.round(clamp(97 + Math.log10(Math.max(10, den) / 450) * 11, 78, 122)),
    mag: Math.round(clamp(92 + (e - 27) * 1.5, 75, 126))
  };
  return { ...d, type, skillId: SKILLS[type].id, st };
}
const skillName = u => SKILLS_BY_ID[u.skillId].displayName;

const ALL = DATA.map(unit);

const isAlive = u => u.hp > 0;
const shieldCap = u => Math.min(35, Math.round(u.maxHp * .3));

// 現在の役割：元前衛は常に front。元後衛は、味方の元前衛が倒れていれば front
function effectiveRole(u, b) {
  if (u.initialSlot === 'front') return 'front';
  const mate = b.units.find(v => v.side === u.side && v !== u);
  return mate && isAlive(mate) ? 'rear' : 'front';
}

// 通常攻撃：ATK参照／魔法：MAG参照（F10）
function calcDamage(power, def, mul, r) {
  return Math.max(1, Math.round(16 * mul * Math.pow(power / 100, .8) * Math.pow(100 / def, .6) * (.95 + r * .1)));
}

function createBattle(blue, red, seed) {
  const defs = [[blue[0], 'blue', 'front'], [blue[1], 'blue', 'rear'], [red[0], 'red', 'front'], [red[1], 'red', 'rear']];
  return {
    version: VERSION, seed, r: seed >>> 0, tick: 0,
    units: defs.map(([d, side, initialSlot]) => ({
      id: side + '-' + initialSlot, d, side, initialSlot,
      hp: d.st.hp, maxHp: d.st.hp, atb: 0, sp: 0, shield: null,
      koTick: null, promotedAtTick: null, dealt: 0, healed: 0, shielded: 0
    })),
    log: [], nextEventId: 1, done: false, winner: null, phase: 'RUNNING', endTick: null
  };
}

const unitById = (b, id) => b.units.find(u => u.id === id);

// tick開始時点のスナップショット
function snapshotStart(b) {
  return new Map(b.units.map(u => [u, { alive: isAlive(u), role: effectiveRole(u, b) }]));
}
function frontAtStart(b, side, start) {
  return b.units.find(u => u.side === side && start.get(u).alive && start.get(u).role === 'front') || null;
}

function pushEvent(b, ev) {
  ev.eventId = b.nextEventId++;
  ev.tick = b.tick;
  b.log.push(ev);
  return ev;
}

// 1tick分の処理（仕様書 3.1 の順番）
function stepBattle(b) {
  if (b.done) return [];
  b.tick++;
  const t = b.tick, from = b.log.length;

  // 2. 期限切れシールドの除去
  for (const u of b.units) {
    if (isAlive(u) && u.shield && u.shield.expiresAtTick <= t) {
      u.shield = null;
      pushEvent(b, { type: 'shield_end', targetId: u.id, label: `${u.d.name}の盾が消えた` });
    }
  }

  // 1. 開始スナップショット
  const start = snapshotStart(b);

  // 3. ATB更新・行動決定（開始時に生存していたユニットのみ）
  const actions = [];
  for (const u of b.units) {
    if (!start.get(u).alive) continue;
    u.atb += 100 / (5.5 * TPS) * (u.d.st.spd / 100);
    if (u.atb < 100) continue;
    u.atb -= 100;
    const skill = SKILLS_BY_ID[u.d.skillId];
    let special = u.sp >= 100;
    if (special && skill.effectKind === 'shield') {
      // 盾が十分残っているなら無駄打ちせず、SPを保持して通常攻撃（F05）
      const rc = frontAtStart(b, u.side, start);
      if (!rc || (rc.shield && rc.shield.amount >= SHIELD_BASE / 2)) special = false;
    }
    if (special) u.sp = 0;
    else if (u.sp < 100) u.sp = Math.min(100, u.sp + 34);
    actions.push({ u, special, skill });
  }

  // 4. 対象・効果量の決定（開始スナップショット基準）
  const effects = [];
  for (const { u, special, skill } of actions) {
    const role = start.get(u).role;
    const enemies = b.units.filter(v => v.side !== u.side && start.get(v).alive);
    if (!enemies.length) continue;
    const target = enemies.find(v => start.get(v).role === 'front') || enemies[0];
    const e = { u, special, role, receiver: target, kind: 'damage', val: 0 };
    if (!special) {
      e.skillId = 'basic'; e.label = '通常攻撃';
      e.style = role === 'front' ? 'melee' : 'ranged';
      e.val = calcDamage(u.d.st.atk, target.d.st.def, 1, rng(b));
    } else {
      e.skillId = skill.id; e.label = skill.displayName; e.style = skill.attackStyle;
      if (skill.effectKind === 'heal') {
        const friends = b.units.filter(v => v.side === u.side && start.get(v).alive);
        e.kind = 'heal';
        e.receiver = friends.reduce((a, c) => a.hp / a.maxHp < c.hp / c.maxHp ? a : c);
        e.val = Math.round(26 * (u.d.st.mag / 100));
      } else if (skill.effectKind === 'shield') {
        e.kind = 'shield';
        e.receiver = frontAtStart(b, u.side, start);
        e.val = Math.min(SHIELD_BASE, shieldCap(e.receiver));
      } else {
        e.val = calcDamage(u.d.st[skill.stat], target.d.st.def, skill.mul, rng(b));
      }
    }
    effects.push(e);
  }

  resolveTick(b, start, effects);
  return b.log.slice(from);
}

// 5〜9. 効果の一括適用 → KO一括確定 → 昇格 → 終了判定
function resolveTick(b, start, effects) {
  const t = b.tick;

  // 5. 受け手ごとに集約して一回で適用。イベントごとの数値は残す
  const byRecv = new Map();
  for (const e of effects) {
    if (!byRecv.has(e.receiver)) byRecv.set(e.receiver, []);
    byRecv.get(e.receiver).push(e);
  }
  for (const [r, list] of byRecv) {
    const hp0 = r.hp;
    let shieldLeft = r.shield ? r.shield.amount : 0, running = hp0, net = 0, heal = 0, newShield = 0;
    for (const e of list) {
      const ev = {
        type: e.kind, actorId: e.u.id, targetId: r.id, skillId: e.skillId, special: e.special,
        attackStyle: e.style, actorRole: e.role,
        actorPosition: posOf(e.u.side, e.role), targetPosition: posOf(r.side, start.get(r).role),
        amount: e.val, hpBefore: running, shieldAbsorbed: 0,
        label: `${e.u.d.name} → ${r.d.name}：${e.label}`
      };
      if (e.kind === 'damage') {
        const ab = Math.min(shieldLeft, e.val);
        shieldLeft -= ab; ev.shieldAbsorbed = ab; net += e.val - ab;
        running = clamp(running - (e.val - ab), 0, r.maxHp);
        e.u.dealt += e.val;
      } else if (e.kind === 'heal') {
        heal += e.val; running = clamp(running + e.val, 0, r.maxHp);
        e.u.healed += e.val;
      } else {
        newShield = Math.max(newShield, e.val);
        e.u.shielded += e.val;
      }
      ev.hpAfter = running;
      ev.shieldAfter = shieldLeft;
      ev.shieldExpiresAtTick = r.shield ? r.shield.expiresAtTick : null;
      e.ev = ev;
    }
    // ダメージ（盾吸収後）と回復を合算し、最後に一度だけclamp
    r.hp = clamp(hp0 - net + heal, 0, r.maxHp);
    if (r.shield) { r.shield.amount = shieldLeft; if (shieldLeft <= 0) r.shield = null; }
    // 新しい盾は加算せず max で更新。期限は再付与時から（次tickから有効）
    if (newShield > 0 && r.hp > 0) {
      const amount = Math.min(shieldCap(r), Math.max(r.shield ? r.shield.amount : 0, newShield));
      r.shield = { amount, expiresAtTick: t + SHIELD_TICKS };
    }
    const last = list[list.length - 1].ev;
    last.hpAfter = r.hp;
    last.shieldAfter = r.shield ? r.shield.amount : 0;
    last.shieldExpiresAtTick = r.shield ? r.shield.expiresAtTick : null;
  }
  for (const e of effects) pushEvent(b, e.ev);

  // 6. KOを一括確定。位置は昇格前（tick開始時）の役割で固定
  const kos = b.units.filter(u => start.get(u).alive && !isAlive(u));
  for (const u of kos) {
    u.koTick = t; u.shield = null;
    pushEvent(b, { type: 'ko', targetId: u.id, koPosition: posOf(u.side, start.get(u).role), label: `${u.d.name}は戦闘不能！` });
  }

  // 7. 昇格：元前衛がKOし、元後衛が生存している場合のみ
  for (const side of ['blue', 'red']) {
    const team = b.units.filter(u => u.side === side);
    const fell = team.find(u => kos.includes(u) && start.get(u).role === 'front');
    const survivor = team.find(u => isAlive(u) && start.get(u).role === 'rear');
    if (fell && survivor) {
      survivor.promotedAtTick = t;
      pushEvent(b, {
        type: 'promotion', targetId: survivor.id,
        actorPosition: posOf(side, 'rear'), targetPosition: posOf(side, 'front'),
        label: `${survivor.d.name}が前衛へ！`
      });
    }
  }

  // 8. 終了判定
  const aliveBlue = b.units.some(u => u.side === 'blue' && isAlive(u));
  const aliveRed = b.units.some(u => u.side === 'red' && isAlive(u));
  if (!aliveBlue || !aliveRed || t >= TICK_LIMIT) {
    b.done = true; b.phase = 'RESOLVING'; b.endTick = t;
    if (!aliveBlue || !aliveRed) b.winner = aliveBlue ? 'blue' : aliveRed ? 'red' : 'draw';
    else {
      const ratio = side => b.units.filter(u => u.side === side).reduce((s, u) => s + u.hp / u.maxHp, 0);
      const a = ratio('blue'), c = ratio('red');
      b.winner = a === c ? 'draw' : a > c ? 'blue' : 'red';
    }
    pushEvent(b, { type: 'victory', winner: b.winner, label: b.winner === 'blue' ? '決着！ 味方の勝利' : b.winner === 'red' ? '決着！ 相手の勝利' : '決着！ 引き分け' });
  }
}

function runToEnd(b) { while (!b.done) stepBattle(b); return b; }

// 候補の再抽選（F03）：選択済みは位置ごと固定し、残り枠だけ差し替える
function rerollPoolPure(pool, picked, rivals, all, rand = Math.random) {
  const keep = new Set(picked), rivalSet = new Set(rivals.map(u => u.code));
  const usable = all.filter(u => !rivalSet.has(u.code) && !keep.has(u.code));
  let cands = shuffleWith(usable.filter(u => !pool.some(p => p.code === u.code)), rand);
  const need = pool.filter(u => !keep.has(u.code)).length;
  if (cands.length < need) cands = cands.concat(shuffleWith(usable.filter(u => !cands.includes(u)), rand));
  const used = new Set();
  return pool.map(u => {
    if (keep.has(u.code)) return u;
    const n = cands.find(c => !used.has(c.code));
    if (!n) return u;
    used.add(n.code);
    return n;
  });
}

globalThis.Core = {

<!-- ===== 画面・演出 ===== -->
<script>
const $ = s => document.querySelector(s), app = $('#app');
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const byCode = new Map(ALL.map(u => [u.code, u]));
const randSeed = () => Math.floor(Math.random() * 2147483647);

let screen = 'title', pool = [], picked = [], rivals = [], front = 0, seed = 1;
let battle = null, view = null, paused = false, loopToken = 0;
let playbackSpeed = .85;   // アプリ起動時に一度だけ初期化（F09）

document.title = '市町村ドラフトバトル ' + VERSION;

function townCard(u) {

function render() {

  }

}

function newGame() {
  seed = randSeed();
  const a = shuffleWith(ALL);
  rivals = a.slice(0, 2); pool = a.slice(2, 8); picked = [];
  screen = 'draft'; render();
}
function rerollPool() { pool = rerollPoolPure(pool, picked, rivals, ALL); render(); }

function startBattle(s) {
  seed = s;
  battle = createBattle([byCode.get(picked[front]), byCode.get(picked[1 - front])], rivals, seed);
  view = createView(battle);
  paused = false;
  screen = 'battle'; render();
}
function finish() { screen = 'result'; render(); }

// ===== 演出（表示用スナップショットとイベントキュー：F02・F06） =====
function createView(b) {
  return {
    disp: new Map(b.units.map(u => [u.id, { hp: u.hp, shield: 0, shieldExp: null, role: u.initialSlot, gone: false }])),
    cursor: 0, active: null, finalMs: 0, dispTick: 0, tickBudget: 0, last: 0, victory: false, hudCache: new Map()
  };
}
function durationOf(ev) {
  switch (ev.type) {
    case 'damage': case 'heal': case 'shield': return ev.special ? 1150 : 480;
    case 'ko': return 520;
    case 'promotion': return 480;
    case 'victory': return 700;
    default: return 0;
  }
}
function applyAtOf(ev) {
  if (ev.type === 'promotion') return 1;
  if (ev.type === 'damage' || ev.type === 'heal' || ev.type === 'shield') return ev.special ? .55 : .5;
  return 0;
}
function applyDisplay(ev) {
  const d = view.disp.get(ev.targetId);
  switch (ev.type) {
    case 'damage': case 'heal': case 'shield':
      d.hp = ev.hpAfter; d.shield = ev.shieldAfter; d.shieldExp = ev.shieldExpiresAtTick; break;
    case 'ko': d.gone = true; d.hp = 0; d.shield = 0; break;
    case 'promotion': d.role = 'front'; break;
    case 'shield_end': d.shield = 0; break;
    case 'victory': view.victory = true; break;
  }
}
function activate(ev) {
  const a = { ev, elapsed: 0, frames: 0, dur: durationOf(ev), applyAt: applyAtOf(ev), applied: false };
  view.active = a;
  view.dispTick = ev.tick;
  if (a.applyAt === 0) { applyDisplay(ev); a.applied = true; }
  if (ev.type !== 'shield_end') {
    const el = $('#event');
    if (el.textContent !== ev.label) el.textContent = ev.label;
  }
}

function advance(delta) {
  const v = view, b = battle;
  if (v.active) {
    const a = v.active;
    a.elapsed += delta; a.frames++;
    if (!a.applied && a.elapsed >= a.dur * a.applyAt) { applyDisplay(a.ev); a.applied = true; }
    if (a.elapsed >= a.dur) {
      if (!a.applied) applyDisplay(a.ev);
      v.active = null;
    }
  }
  if (v.active) return;
  // 未表示イベントは1フレームに1件ずつ順番に開始する
  if (v.cursor < b.log.length) { activate(b.log[v.cursor++]); return; }
  if (!b.done) {
    // 表示が追いついている時だけ計算を進める。イベントが出たらそこで止める
    v.tickBudget += delta / 1000 * TPS * playbackSpeed;
    while (v.tickBudget >= 1 && !b.done) {
      v.tickBudget -= 1;
      const evs = stepBattle(b);
      v.dispTick = b.tick;
      if (evs.length) { v.tickBudget = 0; break; }
    }
    return;
  }

    if (v.finalMs >= 1000) { b.phase = 'RESULT'; finish(); }
  }
}

function loop(ts, token) {
  if (screen !== 'battle' || token !== loopToken) return;
  const v = view;
  if (!v.last) v.last = ts;
  const delta = Math.min(60, ts - v.last);   // タブ復帰時に一気に進めない
  v.last = ts;
  if (!paused) advance(delta);
  if (screen !== 'battle') return;
  draw();
  updateHud();
  requestAnimationFrame(t => loop(t, token));
}

// ===== HUD：初回だけ組み立て、以降は変化した所だけ書き換える（F11） =====
function buildHud() {
  $('#hud').innerHTML = ['blue', 'red'].map(side => `<div data-side="${side}"><b>${side === 'blue' ? '味方' : '相手'}</b>${battle.units.filter(u => u.side === side).map(u => `<div class="hudunit" id="hud-${u.id}"><small><span class="nm">${esc(u.d.name)}</span> <b class="role"></b> <span class="hp"></span> <span class="sh"></span></small><div class="bar"><i></i></div></div>`).join('')}<small class="konote"></small></div>`).join('');
  view.hudCache.clear();
}
function setText(el, key, text) {
  if (view.hudCache.get(key) !== text) { view.hudCache.set(key, text); el.textContent = text; }
}
function updateHud() {
  for (const u of battle.units) {
    const d = view.disp.get(u.id), row = document.getElementById('hud-' + u.id);
    if (!row) continue;
    const k = u.id + ':';
    if (view.hudCache.get(k + 'gone') !== d.gone) { view.hudCache.set(k + 'gone', d.gone); row.style.display = d.gone ? 'none' : ''; }
    if (d.gone) continue;
    setText(row.querySelector('.role'), k + 'role', d.role === 'front' ? '前衛' : '後衛');
    setText(row.querySelector('.hp'), k + 'hp', `${d.hp}/${u.maxHp}`);
    const left = d.shield > 0 && d.shieldExp !== null ? Math.max(0, (d.shieldExp - view.dispTick) / TPS) : 0;
    setText(row.querySelector('.sh'), k + 'sh', d.shield > 0 ? `盾 ${d.shield}（残${left.toFixed(1)}秒）` : '');
    const w = `${100 * d.hp / u.maxHp}%`;
    if (view.hudCache.get(k + 'w') !== w) { view.hudCache.set(k + 'w', w); row.querySelector('.bar i').style.width = w; }
  }
  for (const side of ['blue', 'red']) {
    const gone = battle.units.filter(u => u.side === side && view.disp.get(u.id).gone).map(u => u.d.name);
    setText(document.querySelector(`#hud [data-side="${side}"] .konote`), side + ':ko', gone.length ? '戦闘不能：' + gone.join('、') : '');
  }
}

// ===== Canvas描画 =====
function polygonPath(ctx, x, y, r, n, code) {
  const v = (Number(code) || 1) % 101;
  ctx.beginPath();
  for (let j = 0; j < n; j++) {
    const a = j * 2 * Math.PI / n - Math.PI / 2, rad = r * (.79 + ((j * 7 + v) % 7) / 24);
    const xx = x + Math.cos(a) * rad, yy = y + Math.sin(a) * rad;
    if (j === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
  }
  ctx.closePath();
}
const lerp = (a, b, f) => ({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, scale: a.scale + (b.scale - a.scale) * f });
const ease = f => f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
const isAction = ev => ev.type === 'damage' || ev.type === 'heal' || ev.type === 'shield';
const isLunge = ev => isAction(ev) && ev.attackStyle === 'melee' && ev.actorRole === 'front';

// 表示用の現在位置（論理位置＋昇格移動＋体当たり）
function drawPos(u) {
  const d = view.disp.get(u.id), a = view.active;
  let p = posOf(u.side, d.role);
  if (!a) return p;
  const ev = a.ev, f = Math.min(1, a.elapsed / Math.max(1, a.dur));
  if (ev.type === 'promotion' && ev.targetId === u.id) p = lerp(ev.actorPosition, ev.targetPosition, ease(f));
  if (ev.type === 'ko' && ev.targetId === u.id) p = { ...ev.koPosition };
  if (isLunge(ev) && ev.actorId === u.id) {
    const s = ev.actorPosition, t = ev.targetPosition, hop = Math.sin(f * Math.PI);
    const dist = Math.hypot(t.x - s.x, t.y - s.y), k = Math.max(0, dist - 106) / Math.max(1, dist);
    p = { x: s.x + (t.x - s.x) * k * hop, y: s.y + (t.y - s.y) * k * hop * .78, scale: s.scale };
  }
  return p;
}

function draw() {
  const c = $('#arena'), ctx = c.getContext('2d'), b = battle, v = view, W = 1000, H = 560;
  ctx.clearRect(0, 0, W, H);
  // FF風の疑似遠近感。奥の足場を狭く・薄く描く
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#2d3d55'); sky.addColorStop(.45, '#3b516b'); sky.addColorStop(1, '#182b43');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#34485f'; ctx.fillRect(0, 95, W, 90);
  ctx.fillStyle = '#66758d'; ctx.beginPath(); ctx.moveTo(215, 177); ctx.lineTo(785, 177); ctx.lineTo(1050, 560); ctx.lineTo(-50, 560); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.strokeStyle = '#acbfd3'; ctx.globalAlpha = .24;
  for (let i = 0; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(215 + i * 47.5, 177); ctx.lineTo(-50 + i * 91.7, 560); ctx.stroke(); }
  for (const y of [194, 218, 248, 290, 346, 420, 510]) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1000, y); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#dff0ff'; ctx.textAlign = 'center'; ctx.font = 'bold 21px system-ui';
  ctx.fillText('味方', 108, 43); ctx.fillText('敵', 892, 43);
  ctx.fillStyle = '#ffe0a0'; ctx.fillText(Math.max(0, 50 - v.dispTick / TPS).toFixed(1) + '秒', 500, 43);

  // 描画対象：倒れていないユニット＋KO演出中のユニット（KO位置で消えていく）
  const list = b.units
    .filter(u => !v.disp.get(u.id).gone || (ev && ev.type === 'ko' && ev.targetId === u.id))
    .map(u => ({ u, p: drawPos(u) }))
    .sort((m, n) => m.p.y - n.p.y);
  for (const { u, p } of list) {
    const d = v.disp.get(u.id), { x, y, scale } = p;
    const actor = ev && isAction(ev) && ev.actorId === u.id;
    const fading = ev && ev.type === 'ko' && ev.targetId === u.id;
    const radius = 49 * scale;
    ctx.save();
    if (fading) ctx.globalAlpha = Math.max(0, 1 - f * 1.4);
    ctx.fillStyle = 'rgba(13,24,40,.48)'; ctx.beginPath(); ctx.ellipse(x, y + 32 * scale, 48 * scale, 12 * scale, 0, 0, Math.PI * 2); ctx.fill();
    const pulse = actor ? 1 + .055 * Math.sin(a.elapsed / 16 * .75) : 1;
    if (actor) { ctx.shadowColor = u.side === 'blue' ? '#89dff3' : '#ffc3a0'; ctx.shadowBlur = ev.special ? 38 : 25; }
    polygonPath(ctx, x, y, radius * pulse, 9, u.d.code);
    ctx.fillStyle = u.side === 'blue' ? '#8acde0' : '#eeaf96'; ctx.fill();
    ctx.strokeStyle = '#edf7ff'; ctx.lineWidth = 3; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#183447'; ctx.beginPath();
    ctx.arc(x - 9 * scale, y - 4 * scale, 3.2 * scale, 0, Math.PI * 2); ctx.arc(x + 9 * scale, y - 4 * scale, 3.2 * scale, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = `bold ${Math.round(25 * scale)}px system-ui`; ctx.fillStyle = '#fff';
    ctx.shadowColor = '#142338'; ctx.shadowBlur = 3; ctx.fillText(u.d.name, x, y + radius + 28 * scale); ctx.shadowBlur = 0;
    const hpw = 98 * scale, hh = 11 * scale, barY = y - radius - 27 * scale;
    ctx.fillStyle = '#1a2d43'; ctx.fillRect(x - hpw / 2, barY, hpw, hh);
    ctx.fillStyle = u.side === 'blue' ? '#8bdeb7' : '#f3bf8f'; ctx.fillRect(x - hpw / 2, barY, hpw * (d.hp / u.maxHp), hh);
    ctx.strokeStyle = '#142335'; ctx.strokeRect(x - hpw / 2, barY, hpw, hh);
    // 盾の輪は本体の外側に描く
    if (d.shield > 0) { ctx.strokeStyle = '#9cdeff'; ctx.lineWidth = 4; ctx.globalAlpha *= .9; ctx.beginPath(); ctx.arc(x, y, 60 * scale, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }

  // 行動エフェクト：イベント生成時に凍結した座標を使う。受け手の生死で消さない
  if (ev && isAction(ev)) {
    const s = ev.actorPosition, t = ev.targetPosition;
    const color = ev.type === 'heal' ? '#a5efc0' : ev.type === 'shield' ? '#9fdcf8' : ev.attackStyle === 'magic' ? '#d9b8ff' : '#ffe2a0';
    ctx.save();
    if (!isLunge(ev)) {
      const cx = (s.x + t.x) / 2, cy = Math.min(s.y, t.y) - 85, q = Math.min(1, f / Math.max(.01, a.applyAt));
      ctx.globalAlpha = .8 * (1 - f * .6); ctx.strokeStyle = color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.quadraticCurveTo(cx, cy, t.x, t.y); ctx.stroke();
      if (q < 1) {   // 弾・光球が軌道を飛ぶ
        const bx = (1 - q) * (1 - q) * s.x + 2 * (1 - q) * q * cx + q * q * t.x;
        const by = (1 - q) * (1 - q) * s.y + 2 * (1 - q) * q * cy + q * q * t.y;
        ctx.globalAlpha = 1; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = ev.attackStyle === 'magic' ? 30 : 14;
        ctx.beginPath(); ctx.arc(bx, by, ev.attackStyle === 'magic' ? 17 : 10, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      }
    }
    if (a.applied) {
      const g = Math.min(1, (f - a.applyAt) / Math.max(.01, 1 - a.applyAt));
      ctx.globalAlpha = Math.max(0, 1 - g * .8); ctx.strokeStyle = color; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(t.x, t.y, 20 + g * 30, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = '#ffe7b2'; ctx.textAlign = 'center'; ctx.font = 'bold 30px system-ui';
      ctx.shadowColor = '#142338'; ctx.shadowBlur = 4;
      const txt = ev.type === 'damage' ? `-${ev.amount}` + (ev.shieldAbsorbed ? `（盾${ev.shieldAbsorbed}）` : '') : ev.type === 'heal' ? `+${ev.amount}` : `盾+${ev.amount}`;
      ctx.fillText(txt, t.x, t.y - 78 - g * 14);
    }
    if (ev.special) {   // 必殺技名
      ctx.globalAlpha = Math.min(1, f * 5) * (1 - Math.max(0, f - .8) * 5); ctx.fillStyle = '#fff4de'; ctx.textAlign = 'center';
      ctx.font = 'bold 26px system-ui'; ctx.shadowColor = '#142338'; ctx.shadowBlur = 6;
      ctx.fillText('★ ' + SKILLS_BY_ID[ev.skillId].displayName, s.x, s.y - 105 * s.scale);
    }
    ctx.restore();
  }

  // KOエフェクト：KO発生時に記録した位置に出す（F01）
  if (ev && ev.type === 'ko') {
    const p = ev.koPosition;
    ctx.save(); ctx.globalAlpha = (1 - f) * .8; ctx.strokeStyle = '#ffe5c2'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(p.x, p.y, (18 + f * 40) * p.scale, 0, Math.PI * 2); ctx.stroke();
    ctx.font = 'bold 26px system-ui'; ctx.fillStyle = '#fff4de'; ctx.textAlign = 'center';
    ctx.fillText('KO', p.x, p.y - 55 - f * 22); ctx.restore();
  }

  // 決着表示
  if (v.victory) {
    ctx.save(); ctx.fillStyle = 'rgba(10,18,30,.55)'; ctx.fillRect(0, 230, W, 100);
    ctx.fillStyle = '#f4d28e'; ctx.textAlign = 'center'; ctx.font = 'bold 54px system-ui';
    ctx.fillText(b.winner === 'draw' ? '引き分け' : '決着！', 500, 298); ctx.restore();
  }
}

render();
</script>
</body>
</html>
