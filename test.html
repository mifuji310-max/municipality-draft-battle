<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市町村ドラフトバトル テスト</title>
<style>
body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#101b2b;color:#edf5ff;margin:0;padding:16px}
table{border-collapse:collapse;width:100%;max-width:960px}
td,th{border:1px solid #3a5066;padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}
.ok{color:#88d7b6;font-weight:700}.ng{color:#ff9b8a;font-weight:700}
</style>
</head>
<body>
<h1>戦闘コア 自動テスト <small id="ver"></small></h1>
<p id="summary">実行中…</p>
<table><thead><tr><th>ID</th><th>内容</th><th>結果</th><th>詳細</th></tr></thead><tbody id="rows"></tbody></table>
<script>
(async () => {
  // index.html の <script id="core"> だけを取り出して実行（DOMに依存しない部分）
  const html = await (await fetch('index.html?v=' + Date.now())).text();
  const core = html.match(/<script id="core">([\s\S]*?)<\/script>/)[1];
  new Function(core)();
  const C = globalThis.Core;
  document.getElementById('ver').textContent = C.VERSION;

  const results = [];
  const test = (id, name, fn) => {
    try { const detail = fn(); results.push({ id, name, ok: true, detail: detail || '' }); }
    catch (e) { results.push({ id, name, ok: false, detail: e.message }); }
  };
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
  const samePos = (p, q) => p && q && p.x === q.x && p.y === q.y && p.scale === q.scale;

  // テスト用の架空ユニット
  const mk = (code, name, type, st = {}) => ({ code, name, type, skillId: C.SKILLS[type].id, st: { hp: 100, atk: 100, def: 100, spd: 100, mag: 100, ...st } });
  const evsAt = (b, t) => b.log.filter(e => e.tick === t);
  const real = name => C.ALL.find(u => u.name === name);

  test('T01', '昇格後の後衛KOは前衛位置に出る', () => {
    const b = C.createBattle(
      [mk('1', '青前', 'balanced', { hp: 20 }), mk('2', '青後', 'balanced', { hp: 20 })],
      [mk('3', '赤前', 'balanced', { atk: 300, hp: 999 }), mk('4', '赤後', 'balanced', { atk: 300, hp: 999 })], 1);
    C.runToEnd(b);
    const ko = b.log.find(e => e.type === 'ko' && e.targetId === 'blue-rear');
    assert(b.log.some(e => e.type === 'promotion' && e.targetId === 'blue-rear'), '昇格イベントがない');
    assert(ko, '青後衛のKOがない');
    assert(samePos(ko.koPosition, C.POS.blue.front), 'KO位置が前衛でない: ' + JSON.stringify(ko.koPosition));
    return `KO位置 (${ko.koPosition.x},${ko.koPosition.y})`;
  });

  test('T02', '同tickで前衛・後衛が同時KO → 各自の位置、昇格なし', () => {
    const b = C.createBattle(
      [mk('1', '青前', 'balanced'), mk('2', '青後', 'balanced')],
      [mk('3', '赤前', 'balanced'), mk('4', '赤後', 'balanced')], 1);
    b.tick = 1;
    const start = C.snapshotStart(b);
    const [bf, br, rf] = b.units;
    const eff = (receiver) => ({ u: rf, special: false, role: 'front', receiver, kind: 'damage', val: 999, skillId: 'basic', style: 'melee', label: 'テスト' });
    C.resolveTick(b, start, [eff(bf), eff(br)]);
    const kos = b.log.filter(e => e.type === 'ko');
    assert(kos.length === 2, 'KOが2件でない');
    assert(samePos(kos.find(e => e.targetId === 'blue-front').koPosition, C.POS.blue.front), '前衛のKO位置が違う');
    assert(samePos(kos.find(e => e.targetId === 'blue-rear').koPosition, C.POS.blue.rear), '後衛のKO位置が違う');
    assert(!b.log.some(e => e.type === 'promotion'), '昇格イベントが出ている');
    assert(b.winner === 'red', '勝者が赤でない');
  });

  // 4体とも同じ速度 → 毎回全員が同じtickに行動する
  const mirror = () => C.createBattle(
    [mk('1', '青前', 'balanced', { hp: 30, atk: 400 }), mk('2', '青後', 'balanced', { hp: 30, atk: 400 })],
    [mk('3', '赤前', 'balanced', { hp: 30, atk: 400 }), mk('4', '赤後', 'balanced', { hp: 30, atk: 400 })], 7);

  test('T06', '同tickで双方の最後の1体がKO → 引き分け、不正な昇格なし', () => {
    const b = C.runToEnd(mirror());
    assert(b.winner === 'draw', '引き分けでない: ' + b.winner);
    const last = evsAt(b, b.endTick);
    assert(!last.some(e => e.type === 'promotion'), '最終tickに昇格がある');
    assert(last.filter(e => e.type === 'ko').length === 2, '最終tickのKOが2件でない');
    return `決着tick ${b.endTick}`;
  });

  test('T07', '同tickの複数行動がすべて別イベントで残る', () => {
    const b = C.runToEnd(mirror());
    const t0 = b.log.find(e => e.type === 'damage').tick;
    const first = evsAt(b, t0).filter(e => e.type === 'damage');
    assert(first.length === 4, '同tickの攻撃が4件でない: ' + first.length);
    assert(new Set(first.map(e => e.eventId)).size === 4, 'eventIdが重複');
    return `tick${t0}の攻撃 ${first.length}件`;
  });

  test('T08', '致死ダメージの数値がイベントに残る', () => {
    const b = C.runToEnd(mirror());
    for (const ko of b.log.filter(e => e.type === 'ko')) {
      const hits = b.log.filter(e => e.type === 'damage' && e.tick === ko.tick && e.targetId === ko.targetId);
      assert(hits.length && hits.every(h => h.amount > 0), 'KO攻撃の数値がない');
      assert(hits[hits.length - 1].hpAfter === 0, '最後のhpAfterが0でない');
    }
  });

  test('T09', '相打ちでも成立済みの双方の攻撃が残る', () => {
    const b = C.runToEnd(mirror());
    const last = evsAt(b, b.endTick).filter(e => e.type === 'damage');
    assert(new Set(last.map(e => e.actorId)).size === 2, '相打ちの攻撃が2者分ない');
    // KO後の行動がない
    for (const ko of b.log.filter(e => e.type === 'ko'))
      assert(!b.log.some(e => e.actorId === ko.targetId && e.tick > ko.tick), 'KO後に行動している');
  });

  test('T10', '同編成・同seedを100回 → ログ・HP・勝敗・最終tickが完全一致', () => {
    const run = () => {
      const b = C.runToEnd(C.createBattle([real('北九州市'), real('東峰村')], [real('福岡市'), real('八女市')], 12345));
      return JSON.stringify({ log: b.log, hp: b.units.map(u => u.hp), w: b.winner, t: b.endTick });
    };
    const ref = run();
    for (let i = 0; i < 99; i++) assert(run() === ref, `${i + 2}回目で不一致`);
    return '100回一致';
  });

  test('T11', '候補を再抽選：選択2体・相手は不変、未選択枠だけ更新', () => {
    const all = C.ALL, rivals = [all[0], all[1]], pool = all.slice(2, 8), picked = [pool[1].code, pool[4].code];
    const next = C.rerollPoolPure(pool, picked, rivals, all);
    assert(next.length === 6, '候補数が6でない');
    assert(next[1] === pool[1] && next[4] === pool[4], '選択済みが固定されていない');
    for (const i of [0, 2, 3, 5]) assert(!pool.includes(next[i]), '未選択枠が更新されていない');
  });

  test('T12', '再抽選を繰り返しても重複・相手との重複なし', () => {
    const all = C.ALL, rivals = [all[10], all[20]];
    let pool = all.slice(30, 36);
    const picked = [all[33].code];
    for (let i = 0; i < 200; i++) {
      pool = C.rerollPoolPure(pool, picked, rivals, all);
      const codes = pool.map(u => u.code);
      assert(new Set(codes).size === 6, '候補内で重複');
      assert(!codes.includes(rivals[0].code) && !codes.includes(rivals[1].code), '相手と重複');
      assert(codes.includes(picked[0]), '指名した自治体が消えた');
    }
    return '200回';
  });

  // 盾のテスト用：防御型の前衛＋ほぼ無害な相手で長期戦にする
  const shieldBattle = (spd = 100) => C.createBattle(
    [mk('1', '盾', 'wide', { hp: 120, spd }), mk('2', '青後', 'balanced')],
    [mk('3', '赤前', 'balanced', { atk: 1, hp: 5000 }), mk('4', '赤後', 'balanced', { atk: 1, hp: 5000 })], 3);

  test('T13', '盾を連発しても上限以内・加算蓄積しない', () => {
    const b = shieldBattle(); let maxSeen = 0;
    while (!b.done) {
      C.stepBattle(b);
      for (const u of b.units) if (u.shield) {
        maxSeen = Math.max(maxSeen, u.shield.amount);
        assert(u.shield.amount <= Math.min(C.shieldCap(u), C.SHIELD_BASE), `盾 ${u.shield.amount} が上限超過`);
      }
    }
    assert(b.log.filter(e => e.type === 'shield').length >= 2, '盾が2回以上張られていない');
    return `最大 ${maxSeen}`;
  });

  test('T14', '8ゲーム秒で盾が期限切れになる', () => {
    const b = C.runToEnd(shieldBattle());
    const sh = b.log.find(e => e.type === 'shield');
    const end = b.log.find(e => e.type === 'shield_end' && e.tick > sh.tick);
    assert(end, '期限切れイベントがない');
    assert(end.tick === sh.tick + C.SHIELD_TICKS, `期限切れtick ${end.tick} ≠ ${sh.tick + C.SHIELD_TICKS}`);
    return `付与 ${sh.tick} → 消滅 ${end.tick}`;
  });

  test('T15', '盾が十分残っている時はSPを保持して通常攻撃', () => {
    // 行動が速い盾役：盾の期限内にSPが再び100になる状況を作る
    const b = shieldBattle(300); let checked = 0;
    const wide = b.units[0];
    while (!b.done) {
      const preSp = wide.sp, preShield = b.units[0].shield ? b.units[0].shield.amount : 0;
      const evs = C.stepBattle(b);
      const act = evs.find(e => e.actorId === wide.id);
      if (act && preSp >= 100 && preShield >= C.SHIELD_BASE / 2) {
        assert(act.skillId === 'basic', '盾残量が十分なのに必殺技を使った');
        assert(wide.sp === 100, 'SPが保持されていない');
        checked++;
      }
    }
    assert(checked > 0, '該当状況が発生しなかった');
    return `${checked}回確認`;
  });

  test('T16', '昇格した元後衛の通常攻撃は前衛位置からの体当たり', () => {
    const b = C.createBattle(
      [mk('1', '青前', 'balanced', { hp: 1 }), mk('2', '青後', 'balanced', { hp: 999 })],
      [mk('3', '赤前', 'balanced', { hp: 999, atk: 1 }), mk('4', '赤後', 'balanced', { hp: 999, atk: 1 })], 5);
    while (!b.log.some(e => e.type === 'promotion')) C.stepBattle(b);
    const pt = b.log.find(e => e.type === 'promotion').tick;
    while (!b.log.some(e => e.actorId === 'blue-rear' && e.tick > pt)) C.stepBattle(b);
    const atk = b.log.find(e => e.actorId === 'blue-rear' && e.tick > pt);
    assert(atk.actorRole === 'front', '役割がfrontでない');
    assert(atk.attackStyle === 'melee', '近接でない: ' + atk.attackStyle);
    assert(samePos(atk.actorPosition, C.POS.blue.front), '始点が前衛位置でない');
  });

  test('T17', '技の表示名を変えても判定・ダメージは不変', () => {
    const run = () => {
      const b = C.runToEnd(C.createBattle([real('東峰村'), real('添田町')], [real('福岡市'), real('春日市')], 99));
      return JSON.stringify(b.log.map(({ label, ...rest }) => rest)) + b.winner;
    };
    const before = run(), orig = C.SKILLS.elder.displayName;
    C.SKILLS.elder.displayName = 'テスト用の別名';
    const after = run();
    C.SKILLS.elder.displayName = orig;
    assert(before === after, '表示名変更で結果が変わった');
    assert(before.includes('elder_magic'), '大魔法が一度も使われていない');
  });

  test('T18', '大魔法はMAGとともに増加し、ATKには影響されない', () => {
    let prev = 0;
    for (let mag = 75; mag <= 130; mag++) {
      const d = C.calcDamage(mag, 100, 1.9, .5);
      assert(d >= prev, `MAG ${mag} で減少`); prev = d;
    }
    assert(C.calcDamage(130, 100, 1.9, .5) > C.calcDamage(75, 100, 1.9, .5), '増加していない');
    const firstMagic = st => {
      const b = C.createBattle([mk('1', '長老', 'elder', st), mk('2', '後', 'balanced')], [mk('3', '赤', 'balanced', { hp: 999 }), mk('4', '赤後', 'balanced', { hp: 999 })], 11);
      b.units[0].sp = 100;
      while (!b.log.some(e => e.skillId === 'elder_magic')) C.stepBattle(b);
      return b.log.find(e => e.skillId === 'elder_magic').amount;
    };
    const lo = firstMagic({ mag: 80 }), hi = firstMagic({ mag: 120 });
    assert(hi > lo, `MAG高で威力が上がらない ${lo}→${hi}`);
    assert(firstMagic({ mag: 100, atk: 80 }) === firstMagic({ mag: 100, atk: 120 }), 'ATKで魔法威力が変わった');
    return `MAG80: ${lo} / MAG120: ${hi}`;
  });

  test('T19', '同編成・同seedで魔法ダメージと勝敗が毎回同じ', () => {
    const run = () => {
      const b = C.runToEnd(C.createBattle([real('東峰村'), real('嘉麻市')], [real('久留米市'), real('糸島市')], 2026));
      return JSON.stringify(b.log.filter(e => e.skillId === 'elder_magic').map(e => e.amount)) + b.winner;
    };
    const ref = run();
    for (let i = 0; i < 20; i++) assert(run() === ref, '不一致');
  });

  test('T20', "esc('A&B <C> \"D\" 'E'') が安全", () => {
    const out = C.esc(`A&B <C> "D" 'E'`);
    assert(out === 'A&amp;B &lt;C&gt; &quot;D&quot; &#39;E&#39;', out);
    assert(!out.includes('undefined'), 'undefinedが含まれる');
    return out;
  });

  test('T25', '300seed以上の自動戦闘：例外・未完了なし、イベント順序が正しい', () => {
    const order = { shield_end: 0, damage: 1, heal: 1, shield: 1, ko: 2, promotion: 3, victory: 4 };
    let r = { r: 424242 }, n = 0, wins = { blue: 0, red: 0, draw: 0 };
    for (let i = 0; i < 360; i++) {
      const pick = C.shuffleWith(C.ALL, () => C.rng(r)).slice(0, 4);
      const b = C.runToEnd(C.createBattle(pick.slice(0, 2), pick.slice(2, 4), i * 7919 + 1));
      assert(b.done && b.endTick <= C.TICK_LIMIT, '未完了');
      assert(['blue', 'red', 'draw'].includes(b.winner), '勝敗不正');
      wins[b.winner]++;
      let prevId = 0, prevTick = 0, prevOrd = -1;
      for (const e of b.log) {
        assert(e.eventId > prevId, 'eventIdが単調増加でない'); prevId = e.eventId;
        if (e.tick !== prevTick) { prevTick = e.tick; prevOrd = -1; }
        assert(order[e.type] >= prevOrd, `tick内の順序違反 ${e.type}`); prevOrd = order[e.type];
        if (e.type === 'promotion') {
          const side = e.targetId.split('-')[0];
          assert(b.log.some(k => k.type === 'ko' && k.tick === e.tick && k.targetId === side + '-front'), '前衛KOなしで昇格');
          assert(!b.log.some(k => k.type === 'ko' && k.tick === e.tick && k.targetId === e.targetId), '同時KOした後衛が昇格');
        }
        if (e.type === 'damage' || e.type === 'heal') assert(Number.isFinite(e.amount) && Number.isFinite(e.hpAfter), '数値不正');
      }
      assert(b.log.filter(e => e.type === 'victory').length === 1, '決着イベントが1件でない');
      n++;
    }
    return `${n}戦 完了（味方${wins.blue}・相手${wins.red}・分${wins.draw}）`;
  });

  const rows = document.getElementById('rows');
  rows.innerHTML = results.map(r => `<tr><td>${r.id}</td><td>${C.esc(r.name)}</td><td class="${r.ok ? 'ok' : 'ng'}">${r.ok ? '合格' : '不合格'}</td><td>${C.esc(r.detail)}</td></tr>`).join('');
  const pass = results.filter(r => r.ok).length;
  document.getElementById('summary').textContent = `${pass} / ${results.length} 合格`;
  window.__testResults = results;
})().catch(e => { document.getElementById('summary').textContent = 'エラー: ' + e.message; window.__testResults = [{ id: 'ERR', ok: false, detail: e.message }]; });
</script>
</body>
</html>
