if(screen==='formation'){let a=picked.map(c=>byCode.get(c));app.innerHTML=`<h2>② 前衛・後衛を決めよう</h2><div class="panel"><p>前衛が敵の攻撃を引き受けます。前衛が倒れると後衛が前に出ます。戦闘不能の自治体は攻撃せず、画面から消えます。</p><div class="grid">${[front,1-front].map((i,j)=>`<div class="town" style="padding:15px"><span class="tag">${j?'後衛 · BACK':'前衛 · FRONT'}</span><h2>${a[i].name}</h2><p>★ ${a[i].skill}</p><small>HP ${a[i].st.hp}　防御 ${a[i].st.def}　速度 ${a[i].st.spd}</small></div>`).join('')}</div><div class="controls"><button id="swap">⇄ 前衛・後衛を入れ替え</button><button class="primary" id="fight">戦闘開始 →</button></div></div>`;$('#swap').onclick=()=>{front=1-front;render()};$('#fight').onclick=()=>startBattle(seed)}
if(screen==='battle'){app.innerHTML=`<h2>③ 戦闘 <small>2対2 · 完全オート</small></h2><div class="panel"><div class="status" id="hud"></div><div class="stage"><canvas id="arena" width="1000" height="560"></canvas></div><div class="event" id="event">戦闘開始！</div><div class="controls"><button id="pause">一時停止</button><button id="speed">速度 ×${speed}</button><button id="skip">結果まで進む</button></div></div>`;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'再開':'一時停止'};$('#speed').onclick=()=>{speed=speed===.85?1:speed===1?1.5:.85;$('#speed').textContent='速度 ×'+speed};$('#skip').onclick=()=>{while(!battle.done)step();finish()};last=0;requestAnimationFrame(loop)}
if(screen==='result'){let b=battle;app.innerHTML=`<h2>対戦結果</h2><div class="panel"><div class="winner">${b.winner==='blue'?'勝利！':b.winner==='red'?'敗北':'引き分け'}</div><p style="text-align:center">戦闘時間 ${(b.tick/60).toFixed(1)}秒 · シード ${seed}</p><div class="stats">${b.units.map(u=>`<div class="stat"><b>${u.d.name}</b><br><small>${u.side==='blue'?'味方':'敵'}・${u.slot===0?'前衛':'後衛'}</small><br>与ダメージ ${u.dealt} / 回復 ${u.healed}<br><span class="tag">${u.d.skill}</span></div>`).join('')}</div><div class="controls"><button id="replay">同じシードで再戦</button><button id="again">新シードで再戦</button><button class="primary" id="new">ドラフトへ戻る</button></div></div>`;$('#replay').onclick=()=>startBattle(seed);$('#again').onclick=()=>startBattle(randSeed());$('#new').onclick=newGame}}
function newGame(){seed=randSeed();let a=shuffle(ALL);rivals=a.slice(0,2);pool=a.slice(2,8);picked=[];screen='draft';render()}
function startBattle(s){seed=s;let us=[byCode.get(picked[front]),byCode.get(picked[1-front]),...rivals];battle={units:us.map((d,i)=>({d,side:i<2?'blue':'red',slot:i%2,hp:d.st.hp,max:d.st.hp,atb:0,sp:0,shield:0,dealt:0,healed:0,phase:0,impact:-100,dead:false,koTick:-1,promotedTick:-1})),tick:0,r:seed>>>0,events:[],done:false,winner:null};screen='battle';paused=false;speed=.85;shown=0;highlight=null;highlightStarted=0;tickBudget=0;render()}
function step(){let b=battle;if(b.done)return;b.tick++;let actions=[];for(let u of b.units){if(u.hp<=0)continue;u.atb+=100/(5.5*60)*(u.d.st.spd/100);if(u.atb>=100){u.atb-=100;let special=u.sp>=100;u.sp=special?0:Math.min(100,u.sp+34);actions.push({u,special})}}let effects=[];for(let {u,special} of actions){let enemies=b.units.filter(v=>v.side!==u.side&&v.hp>0),friends=b.units.filter(v=>v.side===u.side&&v.hp>0);if(!enemies.length)continue;let target=enemies.find(v=>v.slot===0)||enemies[0];let d=u.d;let kind=special?d.type:'basic';let val=0,receiver=target;if(kind==='care'){receiver=friends.reduce((a,c)=>a.hp/a.max<c.hp/c.max?a:c);val=Math.round(26*(d.st.mag/100));effects.push({kind:'heal',receiver,val,u})}else if(kind==='wide'){receiver=friends.find(v=>v.slot===0)||friends[0];val=23;effects.push({kind:'shield',receiver,val,u})}else{let mul=kind==='elder'?1.9:kind==='dense'?1.65:kind==='balanced'?1.65:1;val=Math.max(1,Math.round(16*mul*Math.pow(d.st.atk/100,.8)*Math.pow(100/target.d.st.def,.6)*(.95+rng(b)*.1)));effects.push({kind:'damage',receiver,val,u})}let msg=`${d.name} → ${receiver.d.name}：${special?d.skill:'通常攻撃'}`;b.events.push({tick:b.tick,msg,from:u,receiver,kind,val});u.impact=b.tick;if(b.events.length>90)b.events.shift()}
// 同一tickの効果を集約してから戦闘不能を判定
let agg=new Map();for(let e of effects){let v=agg.get(e.receiver)||{damage:0,heal:0,shield:0};v[e.kind]+=e.val;agg.set(e.receiver,v);if(e.kind==='damage')e.u.dealt+=e.val;if(e.kind==='heal')e.u.healed+=e.val}for(let [u,v] of agg){let wasAlive=u.hp>0;let absorbed=Math.min(u.shield,v.damage);u.shield-=absorbed;u.hp=clamp(u.hp-v.damage+absorbed+v.heal,0,u.max);u.shield+=v.shield;if(wasAlive&&u.hp<=0){u.dead=true;u.koTick=b.tick;b.events.push({tick:b.tick,msg:`${u.d.name}は戦闘不能！`,from:null,receiver:u,kind:'ko',val:0});let replacement=b.units.find(z=>z.side===u.side&&z.slot===1&&z.hp>0);if(replacement&&u.slot===0){replacement.promotedTick=b.tick;b.events.push({tick:b.tick,msg:`${replacement.d.name}が前衛へ！`,from:null,receiver:replacement,kind:'promotion',val:0})}}}let aliveBlue=b.units.some(u=>u.side==='blue'&&u.hp>0),aliveRed=b.units.some(u=>u.side==='red'&&u.hp>0);if(!aliveBlue||!aliveRed||b.tick>=3000){b.done=true;let a=b.units.filter(u=>u.side==='blue').reduce((s,u)=>s+u.hp/u.max,0),c=b.units.filter(u=>u.side==='red').reduce((s,u)=>s+u.hp/u.max,0);b.winner=a===c?'draw':a>c?'blue':'red'}}
function finish(){screen='result';render()}
function loop(ts){if(screen!=='battle')return;if(!last)last=ts;let delta=Math.min(60,ts-last);last=ts;if(!paused){tickBudget+=delta/1000*60*speed;let steps=Math.floor(tickBudget);tickBudget-=steps;for(let i=0;i<steps&&!battle.done;i++)step()}if(battle.done){finish();return}let e=battle.events.at(-1);if(e&&(e.tick!==shown||e!==highlight)){shown=e.tick;highlight=e;highlightStarted=battle.tick;$('#event').textContent=e.msg}let b=battle;$('#hud').innerHTML=['blue','red'].map(side=>{let team=b.units.filter(u=>u.side===side),frontAlive=team.some(u=>u.slot===0&&u.hp>0);return `<div><b>${side==='blue'?'味方':'相手'}</b>${team.filter(u=>u.hp>0).map(u=>`<small style="display:block;margin-top:5px;color:#edf5ff">${u.d.name} <b style="color:#f0d28c">${u.slot===0||!frontAlive?'前衛':'後衛'}</b> ${Math.max(0,u.hp)}/${u.max}</small><div class="bar"><i style="width:${100*u.hp/u.max}%"></i></div>`).join('')}${team.some(u=>u.hp<=0)?`<small style="display:block;margin-top:6px;opacity:.68">戦闘不能：${team.filter(u=>u.hp<=0).map(u=>u.d.name).join('、')}</small>`:''}</div>`}).join('');draw();requestAnimationFrame(loop)}
function effectivePos(u){let i=battle.units.indexOf(u),front= i<2?battle.units[0]:battle.units[2],base=[[335,430,1.15],[155,257,.79],[665,430,1.15],[845,257,.79]];if(u.slot===1&&front.hp<=0)return [i===1?335:665,430,1.15];return [...base[i]]}
function polygonPath(ctx,x,y,r,n,code){let v=(Number(code)||1)%101;ctx.beginPath();for(let j=0;j<n;j++){let a=j*2*Math.PI/n-Math.PI/2,rad=r*(.79+((j*7+v)%7)/24),xx=x+Math.cos(a)*rad,yy=y+Math.sin(a)*rad;if(j===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.closePath()}
function draw(){let c=$('#arena'),ctx=c.getContext('2d'),b=battle,W=1000,H=560;ctx.clearRect(0,0,W,H);
// FF風の疑似遠近感。奥の足場を狭く・薄く描く。
let sky=ctx.createLinearGradient(0,0,0,560);sky.addColorStop(0,'#2d3d55');sky.addColorStop(.45,'#3b516b');sky.addColorStop(1,'#182b43');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#34485f';ctx.fillRect(0,95,W,90);
ctx.fillStyle='#66758d';ctx.beginPath();ctx.moveTo(215,177);ctx.lineTo(785,177);ctx.lineTo(1050,560);ctx.lineTo(-50,560);ctx.closePath();ctx.fill();
ctx.save();ctx.strokeStyle='#acbfd3';ctx.globalAlpha=.24;for(let i=0;i<=12;i++){ctx.beginPath();ctx.moveTo(215+i*47.5,177);ctx.lineTo(-50+i*91.7,560);ctx.stroke()}for(let y of [194,218,248,290,346,420,510]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}ctx.restore();
ctx.fillStyle='#dff0ff';ctx.textAlign='center';ctx.font='bold 21px system-ui';ctx.fillText('味方',108,43);ctx.fillText('敵',892,43);ctx.fillStyle='#ffe0a0';ctx.fillText((50-b.tick/60).toFixed(1)+'秒',500,43);
// 奥のキャラから手前のキャラの順に表示。ただしHP0は描画しない。
let alive=b.units.filter(u=>u.hp>0).sort((a,z)=>effectivePos(a)[1]-effectivePos(z)[1]);
for(let u of alive){let [x0,y,scale]=effectivePos(u),x=x0;let e=highlight,dt=e?b.tick-highlightStarted:999,actor=e&&e.from===u&&dt>=0&&dt<40;
if(actor&&e.kind==='damage'&&e.from.slot===0&&!e.msg.includes('大魔法')){let [tx,ty]=effectivePos(e.receiver),hop=Math.sin(dt/40*Math.PI);x+=(tx>x?1:-1)*Math.max(0,Math.abs(tx-x)-106)*hop;y+=(ty-y)*hop*.78} 
if(u.promotedTick>=0&&b.tick-u.promotedTick<48){let f=(b.tick-u.promotedTick)/48,atBack=u.side==='blue'?155:845;x=atBack+(x-atBack)*f;y=257+(430-257)*f;scale=.79+(.36*f)}
let radius=49*scale;
ctx.save();ctx.fillStyle='rgba(13,24,40,.48)';ctx.beginPath();ctx.ellipse(x,y+32*scale,48*scale,12*scale,0,0,Math.PI*2);ctx.fill();
let pulse=actor?1+.055*Math.sin(dt*.75):1;
if(actor){ctx.shadowColor=u.side==='blue'?'#89dff3':'#ffc3a0';ctx.shadowBlur=25}
polygonPath(ctx,x,y,radius*pulse,9,u.d.code);ctx.fillStyle=u.side==='blue'?'#8acde0':'#eeaf96';ctx.fill();ctx.strokeStyle='#edf7ff';ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0;
ctx.fillStyle='#183447';ctx.beginPath();ctx.arc(x-9*scale,y-4*scale,3.2*scale,0,Math.PI*2);ctx.arc(x+9*scale,y-4*scale,3.2*scale,0,Math.PI*2);ctx.fill();
ctx.textAlign='center';ctx.font=`bold ${Math.round(25*scale)}px system-ui`;ctx.fillStyle='#fff';ctx.shadowColor='#142338';ctx.shadowBlur=3;ctx.fillText(u.d.name,x,y+radius+28*scale);ctx.shadowBlur=0;
let hpw=98*scale,hh=11*scale,barY=y-radius-27*scale;ctx.fillStyle='#1a2d43';ctx.fillRect(x-hpw/2,barY,hpw,hh);ctx.fillStyle=u.side==='blue'?'#8bdeb7':'#f3bf8f';ctx.fillRect(x-hpw/2,barY,hpw*(u.hp/u.max),hh);ctx.strokeStyle='#142335';ctx.strokeRect(x-hpw/2,barY,hpw,hh);
if(u.shield){ctx.strokeStyle='#9cdeff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,43*scale,0,Math.PI*2);ctx.stroke()}
ctx.restore()}
// 攻撃エフェクトは動的座標を使う。戦闘不能の自治体から線を出さない。
let e=highlight,dt=e?b.tick-highlightStarted:999;
if(e&&dt>=0&&dt<60&&e.from&&e.receiver&&e.from.hp>0&&e.receiver.hp>0){let [sx,sy]=effectivePos(e.from),[tx,ty]=effectivePos(e.receiver);let progress=dt/60;
ctx.save();ctx.globalAlpha=Math.max(0,1-progress);ctx.lineWidth=e.kind==='damage'?5:4;ctx.strokeStyle=e.kind==='heal'?'#a5efc0':e.kind==='shield'?'#9fdcf8':'#ffe2a0';if(e.kind!=='damage'||e.from.slot!==0||e.msg.includes('大魔法')){ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo((sx+tx)/2,Math.min(sy,ty)-85,tx,ty);ctx.stroke();}ctx.beginPath();ctx.arc(tx,ty,20+progress*28,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffe7b2';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText((e.kind==='damage'?'-':'+')+e.val,tx,ty-75);ctx.restore()}
// KOした位置には、ごく短い消滅エフェクトだけを描く。キャラ本体は描かない。
for(let u of b.units){if(u.hp>0||u.koTick<0)continue;let dt=b.tick-u.koTick;if(dt>32)continue;let i=b.units.indexOf(u),base=[[335,430,1.15],[155,257,.79],[665,430,1.15],[845,257,.79]][i],x=base[0],y=base[1],r=(18+dt)*base[2];ctx.save();ctx.globalAlpha=(1-dt/32)*.75;ctx.strokeStyle='#ffe5c2';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.font='bold 22px system-ui';ctx.fillStyle='#fff4de';ctx.textAlign='center';ctx.fillText('KO',x,y-50-dt*.7);ctx.restore()}
}
render();</script></body></html>
